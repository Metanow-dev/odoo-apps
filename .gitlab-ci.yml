# The Odoo module's pipeline. README.md, "Branches and releases".
#
# develop: test, package, install into Odoo beside efis.
# main:    the same, then release: publish the zip to the package registry and move the series
#          branch (20.0), which GitHub mirrors and the Odoo Apps store reads.
# 20.0:    written only by the release job. No pipeline runs on it.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"

default:
  # The shared runner takes tagged jobs only.
  tags: [docker]
  interruptible: true

stages:
  - test
  - package
  - install
  - release

variables:
  # The Odoo series this branch builds. The manifest's version must start with it.
  ODOO_SERIES: "20.0"
  # The efis version the module is tested against. Move it together with the two copies listed
  # in contract/README.md, never on its own.
  EFIS_IMAGE: "cloud3.cloud-blueberry.com/efis/efis:daaf167ccc6582064c4f3b4d30b486a06ecfcb93"
  EFIS_ODOO_IMAGE: "odoo:20.0"

test:
  stage: test
  image: python:3.13-alpine
  script:
    - python -m unittest discover -s tests -t tests -v
    - |
      python - <<'EOF'
      import ast, os, sys
      series = os.environ["ODOO_SERIES"]
      for module in ("metanow_fiscalization", "metanow_fiscalization_stock"):
          version = ast.literal_eval(open(f"{module}/__manifest__.py", encoding="utf-8").read())["version"]
          if not version.startswith(series + "."):
              sys.exit(f"{module} manifest version {version} is not for series {series}")
      EOF

# DEV-1766: one zip for every customer, byte-identical on every rebuild, with its SHA-256 and a
# manifest.json for the efis web app's Plugins page. DEV-2429: the stock add-on is a zip of its
# own, with its own manifest.json in dist/odoo-stock; dist/odoo is the main module's, as before.
package:
  stage: package
  image: python:3.13-alpine
  script:
    - python tools/package.py --out dist/odoo --manifest
    - python tools/package.py --module metanow_fiscalization_stock --out dist/odoo-stock --manifest
    - python -m zipfile -e dist/odoo/metanow_fiscalization-*.zip dist/odoo/addons
    - python -m zipfile -e dist/odoo-stock/metanow_fiscalization_stock-*.zip dist/odoo/addons
    - cat dist/odoo/*.sha256 dist/odoo-stock/*.sha256
  artifacts:
    paths:
      - dist/odoo/
      - dist/odoo-stock/
    expire_in: 90 days

# DEV-1731: the zip installed into a disposable Odoo beside the pinned efis image, posting one
# invoice through efis to the mock authority. ci/odoo-install.sh refuses any other endpoint, and
# nothing here reaches the authority. Pulling EFIS_IMAGE needs this project on efis/efis's job
# token allowlist (README.md, "Setting up").
install:
  stage: install
  resource_group: odoo-install
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [package]
  script:
    - printf '%s\n' "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "${EFIS_IMAGE%%/*}"
    - sh ci/odoo-install.sh
  artifacts:
    when: always
    paths:
      - odoo-install.log
      - odoo-install-efis.log
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# A release is a new version. Each module's zip goes to this project's package registry under its
# own name and version, where a version is written once. A module whose version is already
# released is left as it is only if its zip is the released one, byte for byte; one that changed
# under a released version fails the release, and so does a release in which no module has a new
# version. So bump `version` in the manifest of each module that changed first. Then the series branch moves to this
# commit. The push is not forced, so a commit made on 20.0 by hand fails the release instead of
# being overwritten.
release:
  stage: release
  image: alpine:3.21
  needs: [test, package, install]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      test -n "$ODOO_APPS_PUSH_TOKEN" || { echo "ODOO_APPS_PUSH_TOKEN must be set, protected and masked: a project access token of this project, Maintainer, write_repository." >&2; exit 1; }
    - |
      released=0
      for entry in metanow_fiscalization:dist/odoo metanow_fiscalization_stock:dist/odoo-stock; do
        MODULE="${entry%%:*}"; DIR="${entry#*:}"
        ZIP="$(ls "$DIR/$MODULE"-*.zip)"
        VERSION="$(basename "$ZIP" .zip | sed "s/^$MODULE-//")"
        PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${MODULE}/${VERSION}"
        if RELEASED="$(curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" "$PACKAGE_URL/$(basename "$ZIP").sha256")"; then
          # The zip is byte-identical on every rebuild, so an unchanged module has the released
          # checksum. A module that changed under a released version would reach 20.0 unbumped.
          if [ "$RELEASED" != "$(cat "$ZIP.sha256")" ]; then
            echo "$MODULE changed, but $VERSION is already released. Bump version in $MODULE/__manifest__.py." >&2; exit 1
          fi
          echo "$MODULE $VERSION is already released and unchanged; left as it is."
          continue
        fi
        for file in "$ZIP" "$ZIP.sha256" "$DIR/manifest.json"; do
          curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$PACKAGE_URL/$(basename "$file")?select=package_file" > /dev/null
        done
        released=$((released + 1))
      done
      if [ "$released" -eq 0 ]; then
        echo "No module has a new version. Bump version in the __manifest__.py of the module that changed." >&2; exit 1
      fi
    - git push "https://release:${ODOO_APPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/${ODOO_SERIES}"
